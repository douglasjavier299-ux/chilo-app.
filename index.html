<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8b1114">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chilo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Ventas, gastos y resumen de Chilo.">
<title>Chilo</title>
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon.png">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./styles.css">
<script src="./config.js"></script>
<script src="./app.js" defer></script>
</head>
<body>
<main id="app">
  <iframe id="operations" title="Chilo · Operaciones y Automatización" allow="clipboard-write" hidden></iframe>
  <section id="launch" aria-labelledby="launchTitle">
    <img class="app-icon" src="./icons/icon-192.png" width="112" height="112" alt="Chilo">
    <h1 id="launchTitle">Chilo</h1>
    <p class="subtitle">Operaciones y Automatización</p>
    <div id="spinner" class="spinner" aria-hidden="true"></div>
    <p id="launchMessage" role="status">Abriendo tus operaciones…</p>
    <div id="recovery" class="buttons" hidden>
      <button id="retry" type="button">Volver a intentar</button>
      <a id="openDirect" target="_blank" rel="noopener">Abrir operaciones directamente</a>
    </div>
  </section>
  <p id="offline" role="status" hidden>Sin conexión. Conéctate a internet para guardar.</p>
</main>
<noscript>Activa JavaScript para abrir Chilo.</noscript>
</body>
</html>
