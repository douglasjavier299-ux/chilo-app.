<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conectar Chilo</title><link rel="icon" href="./favicon.png"><style>body{font:16px/1.6 system-ui;background:#fffaf7;color:#3b181d;margin:0;padding:30px 20px}main{max-width:580px;margin:35px auto}h1{font:500 36px Georgia}label{display:grid;gap:8px}input{padding:13px;font:inherit;border:1px solid #dfc8cd;border-radius:9px}button{background:#8b1114;color:white;border:0;padding:13px 22px;border-radius:10px;font:600 15px system-ui;margin-top:18px;cursor:pointer}p{color:#725c61}.status{color:#8b1114}img{border-radius:20px}</style></head><body><main><img src="./icon-192.png" width="84" height="84" alt="Chilo"><h1>Conectar Chilo</h1><p>Pega el enlace de tu aplicación web de Apps Script que termina en <strong>/exec</strong>.</p><form id="setup"><label>Enlace de tu app<input id="url" type="url" placeholder="https://script.google.com/macros/s/…/exec" required></label><button type="submit">Descargar configuración</button></form><p id="status" class="status" role="status"></p><p>Reemplaza <strong>config.js</strong> en la carpeta web con el archivo descargado. Luego sube el contenido de esa carpeta a GitHub.</p></main><script>document.getElementById('setup').onsubmit=e=>{e.preventDefault();let url;try{url=new URL(document.getElementById('url').value.trim());if(url.protocol!=='https:'||url.hostname!=='script.google.com'||url.username||url.password||!/^\/macros\/s\/[a-zA-Z0-9_-]+\/exec$/.test(url.pathname))throw Error();}catch(_){document.getElementById('status').textContent='Usa el enlace público de Apps Script terminado en /exec.';return;}const content='window.CHILO_CONFIG = '+JSON.stringify({appsScriptUrl:url.href},null,2)+';\n',blob=URL.createObjectURL(new Blob([content],{type:'text/javascript'})),a=document.createElement('a');a.href=blob;a.download='config.js';a.click();setTimeout(()=>URL.revokeObjectURL(blob),2000);document.getElementById('status').textContent='Archivo descargado. Reemplaza config.js con este archivo.';};</script></body></html>
